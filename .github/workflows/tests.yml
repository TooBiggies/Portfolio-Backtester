name: test

# Gira su ogni pull request e sui push verso i branch condivisi.
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

# Se si pusha due volte sulla stessa PR, la run vecchia viene annullata:
# interessa l'esito dell'ultimo commit, non la cronologia.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # pyproject richiede >=3.14: si testa la versione dichiarata e la successiva,
        # così un'API rimossa si vede qui e non sul portatile di qualcuno.
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installa le dipendenze
        # Si installano i pacchetti e non il progetto: requirements.txt contiene anche
        # roba che ai test non serve.
        #
        # Streamlit PERO' serve: `tests/test_ui_app.py` lo importa e senza di lui quei
        # casi vengono SALTATI (`importorskip`), non falliti. Cosi' il 28/10 la CI e'
        # rimasta verde su develop mentre in locale un test di interfaccia era rosso:
        # #76 ha sostituito le card delle metriche con una tabella e il test aggiunto
        # da #77 cercava ancora quelle card. Un test saltato non protegge niente.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=3.0.3" "numpy>=2.4.6" "matplotlib>=3.10.9" "openpyxl>=3.1.5" "pytest>=8" "streamlit>=1.66.1"

      - name: Versione effettiva
        run: python -c "import sys, pandas, numpy; print(sys.version); print('pandas', pandas.__version__, '| numpy', numpy.__version__)"

      - name: Test
        # I test leggono Timeseries.csv dalla radice del repo e il backend
        # matplotlib è senza display su un runner: nessuna configurazione extra.
        # `main` oggi contiene solo README e .github, senza codice né tests/: senza
        # questa guardia ogni push su main sarebbe rosso per assenza della cartella,
        # che non è un errore. L'esenzione vale solo per main.
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ ! -d tests ]; then
            echo "main non contiene ancora il codice: nessun test da eseguire"
            exit 0
          fi
          # I test di interfaccia (marker `ui`) non devono poter sparire in silenzio:
          # si verifica che siano stati raccolti e saltati solo se streamlit manca davvero.
          python -m pytest tests -q -m "not ui" -p no:cacheprovider
          python -m pytest tests -q -m ui -p no:cacheprovider
