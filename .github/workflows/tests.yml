name: test

# Gira su ogni pull request e sui push verso i branch condivisi.
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

# Se si pusha due volte sulla stessa PR, la run vecchia viene annullata:
# interessa l'esito dell'ultimo commit, non la cronologia.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # pyproject richiede >=3.14: si testa la versione dichiarata e la successiva,
        # così un'API rimossa si vede qui e non sul portatile di qualcuno.
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installa le dipendenze
        # Si installano i pacchetti e non il progetto: requirements.txt contiene
        # l'intero stack Streamlit, inutile per i test (e lento da risolvere).
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=3.0.3" "numpy>=2.4.6" "matplotlib>=3.10.9" "openpyxl>=3.1.5" "pytest>=8"

      - name: Versione effettiva
        run: python -c "import sys, pandas, numpy; print(sys.version); print('pandas', pandas.__version__, '| numpy', numpy.__version__)"

      - name: Test
        # I test leggono Timeseries.csv dalla radice del repo e il backend
        # matplotlib è senza display su un runner: nessuna configurazione extra.
        run: python -m pytest tests -q --maxfail=1 -p no:cacheprovider
